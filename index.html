<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>
(() => {

  const API = "https://dinocaht.onrender.com";

  const TOKEN_KEY = "dinochat_token";
  const USER_KEY = "dinochat_user";
  const GUEST_KEY = "dinochat_guest";

  let token = localStorage.getItem(TOKEN_KEY) || "";
  let isGuest = localStorage.getItem(GUEST_KEY) === "true";

  let socket = null;
  let user = null;
  let messages = [];
  let currentRankings = [];

  const layouts = [
    ["classic","Classic"],
    ["compact","Compact"],
    ["chatFirst","Chat First"],
    ["profileFirst","Profile First"],
    ["mobileBar","Mobile Bar"],
    ["wideChat","Wide Chat"],
    ["actionFocus","Action Focus"],
    ["minimal","Minimal"],
    ["split","Split Grid"],
    ["dashboard","Dashboard"]
  ];

  const $ = id => document.getElementById(id);

  const esc = v =>
    String(v ?? "").replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

  const toast = msg => {
    const e = $("toast");
    if (!e) return;

    e.textContent = msg;
    e.classList.add("show");

    clearTimeout(window.__toast);

    window.__toast = setTimeout(() => {
      e.classList.remove("show");
    }, 2800);
  };

  const api = async (path, options = {}) => {

    const headers = {
      "Content-Type":"application/json",
      ...(options.headers || {})
    };

    if (token) {
      headers.Authorization = `Bearer ${token}`;
    }

    const res = await fetch(API + path, {
      ...options,
      headers
    });

    let data = {};

    try {
      data = await res.json();
    } catch {}

    if (!res.ok) {
      throw new Error(
        data.error ||
        data.message ||
        `Request failed (${res.status})`
      );
    }

    return data;
  };

  const setServer = (online, text) => {

    const e = $("serverBadge");

    if (!e) return;

    e.classList.toggle("online", !!online);

    const span = e.querySelector("span");

    if (span) {
      span.textContent = text;
    }
  };

  const showAuth = show => {

    $("authScreen").style.display =
      show ? "grid" : "none";

    $("app").style.display =
      show ? "none" : "block";
  };

  const authError = msg => {

    if ($("authError")) {
      $("authError").textContent = msg || "";
    }
  };

  /* =========================================================
     AUTH TABS
  ========================================================= */

  function switchAuth(which) {

    const reg = which === "register";

    $("registerTab").classList.toggle(
      "active",
      reg
    );

    $("loginTab").classList.toggle(
      "active",
      !reg
    );

    $("registerPanel").classList.toggle(
      "active",
      reg
    );

    $("loginPanel").classList.toggle(
      "active",
      !reg
    );

    authError("");
  }

  $("registerTab").onclick = () =>
    switchAuth("register");

  $("loginTab").onclick = () =>
    switchAuth("login");


  /* =========================================================
     GUEST MODE
  ========================================================= */

  function enterGuestMode() {

    isGuest = true;

    token = "";

    localStorage.setItem(
      GUEST_KEY,
      "true"
    );

    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);

    user = {
      username:"Guest User",
      dino_id:null,
      dinoId:null,
      dino_score:0,
      dinoScore:0,
      is_guest:true
    };

    showAuth(false);

    setServer(
      true,
      "Guest Mode"
    );

    updateProfile();
    renderGuestProfile();
    renderScores();
    renderAccount();

    openPage("home");

    toast("Welcome, Guest User!");
  }


  function exitGuestMode() {

    isGuest = false;

    localStorage.removeItem(
      GUEST_KEY
    );

    token = "";

    user = null;

    if (socket) {
      socket.disconnect();
      socket = null;
    }

    showAuth(true);

    switchAuth("login");

    authError("");

    $("authStatus").textContent =
      "Create or sign in with your Dino ID.";

    toast("Guest mode closed.");
  }


  function requireDinoId() {

    if (!isGuest) {
      return true;
    }

    toast(
      "🔒 You need a Dino ID to use this feature."
    );

    return false;
  }


  function openDinoLogin() {

    isGuest = false;

    localStorage.removeItem(
      GUEST_KEY
    );

    user = null;

    showAuth(true);

    switchAuth("register");

    $("authStatus").textContent =
      "Create your permanent Dino ID to unlock Dino Score.";
  }


  function renderGuestProfile() {

    if (!isGuest) return;

    if ($("sideName"))
      $("sideName").textContent =
        "Guest User";

    if ($("sideDinoId"))
      $("sideDinoId").textContent =
        "Guest";

    if ($("sideAvatar"))
      $("sideAvatar").textContent =
        "G";

    if ($("scoreName"))
      $("scoreName").textContent =
        "Guest User";

    if ($("usernameInput"))
      $("usernameInput").value =
        "Guest User";

    if ($("dinoIdInput"))
      $("dinoIdInput").value =
        "No Dino ID";

    if ($("scoreNumber"))
      $("scoreNumber").textContent =
        "—";

    if ($("scoreRowNumber"))
      $("scoreRowNumber").textContent =
        "—";

    if ($("coinNumber"))
      $("coinNumber").textContent =
        "—";

    if ($("betBalance"))
      $("betBalance").textContent =
        "—";
  }


  /* =========================================================
     GUEST BUTTON
  ========================================================= */

  const guestBtn = $("guestBtn");

  if (guestBtn) {
    guestBtn.onclick =
      enterGuestMode;
  } else {

    const button =
      document.createElement("button");

    button.className = "btn";

    button.id = "guestBtn";

    button.style.width = "100%";
    button.style.marginTop = "14px";

    button.textContent =
      "👤 Continue as Guest";

    button.onclick =
      enterGuestMode;

    const error =
      $("authError");

    if (error) {
      error.parentNode.insertBefore(
        button,
        error
      );
    }
  }


  /* =========================================================
     REGISTER
  ========================================================= */

  async function register() {

    const username =
      $("registerUsername")
        .value
        .trim();

    if (username.length < 2) {

      return authError(
        "Username must contain at least 2 characters."
      );
    }

    authError("");

    $("registerBtn").disabled = true;

    $("registerBtn").textContent =
      "Creating…";

    try {

      const data =
        await api(
          "/api/register",
          {
            method:"POST",
            body:JSON.stringify({
              username
            })
          }
        );

      await finishLogin(data);

    } catch (e) {

      authError(e.message);

    } finally {

      $("registerBtn").disabled =
        false;

      $("registerBtn").textContent =
        "Create permanent Dino ID";
    }
  }


  /* =========================================================
     LOGIN
  ========================================================= */

  async function login() {

    const dinoId =
      $("loginDinoId")
        .value
        .trim()
        .toUpperCase();

    if (!dinoId) {

      return authError(
        "Enter your permanent Dino ID."
      );
    }

    authError("");

    $("loginBtn").disabled =
      true;

    $("loginBtn").textContent =
      "Signing in…";

    try {

      const data =
        await api(
          "/api/login",
          {
            method:"POST",
            body:JSON.stringify({
              dinoId
            })
          }
        );

      await finishLogin(data);

    } catch (e) {

      authError(e.message);

    } finally {

      $("loginBtn").disabled =
        false;

      $("loginBtn").textContent =
        "Sign in";
    }
  }


  $("registerBtn").onclick =
    register;

  $("loginBtn").onclick =
    login;


  /* =========================================================
     LOGIN FINISH
  ========================================================= */

  async function finishLogin(data) {

    isGuest = false;

    localStorage.removeItem(
      GUEST_KEY
    );

    token =
      data.token ||
      data.accessToken ||
      token;

    if (!token) {

      throw new Error(
        "Server did not return a login token."
      );
    }

    localStorage.setItem(
      TOKEN_KEY,
      token
    );

    if (data.user) {

      localStorage.setItem(
        USER_KEY,
        JSON.stringify(data.user)
      );
    }

    await bootstrap();

    showAuth(false);

    toast(
      `Welcome, ${user.username}!`
    );
  }


  /* =========================================================
     SERVER HEALTH
  ========================================================= */

  async function health() {

    try {

      const r =
        await fetch(
          API + "/api/health"
        );

      if (!r.ok) {
        throw new Error();
      }

      setServer(
        true,
        "DinoChat server online"
      );

      return await r.json();

    } catch {

      setServer(
        false,
        "Server unavailable"
      );

      return null;
    }
  }


  /* =========================================================
     BOOTSTRAP
  ========================================================= */

  async function bootstrap() {

    if (isGuest) {
      return;
    }

    setServer(
      false,
      "Connecting…"
    );

    const account =
      await api(
        "/api/account"
      );

    await health();

    user =
      account.user ||
      account;

    localStorage.setItem(
      USER_KEY,
      JSON.stringify(user)
    );

    updateProfile();

    await Promise.all([
      loadMessages(),
      loadRankings(),
      loadAchievements(),
      loadFriends(),
      loadSocial(),
      loadBets(),
      loadLayout()
    ]);

    connectSocket();

    applyTheme();

    renderThemes();

    renderScores();

    renderAccount();

    renderLayoutButtons();

    setServer(
      true,
      "DinoChat server online"
    );
  }


  /* =========================================================
     PROFILE
  ========================================================= */

  function updateProfile() {

    const username =
      user?.username ||
      "DinoUser";

    const dinoId =
      user?.dino_id ||
      user?.dinoId ||
      "DINO-…";

    if ($("sideName"))
      $("sideName").textContent =
        username;

    if ($("sideDinoId"))
      $("sideDinoId").textContent =
        dinoId;

    if ($("sideAvatar"))
      $("sideAvatar").textContent =
        username
          .charAt(0)
          .toUpperCase();

    if ($("scoreName"))
      $("scoreName").textContent =
        username;
  }


  function renderAccount() {

    if (!user) return;

    if ($("usernameInput"))
      $("usernameInput").value =
        user.username || "";

    if ($("dinoIdInput"))
      $("dinoIdInput").value =
        user.dino_id ||
        user.dinoId ||
        "";

    if ($("betBalance"))
      $("betBalance").textContent =
        Number(
          user.dino_score ??
          0
        ).toFixed(2);
  }


  /* =========================================================
     ACCOUNT SAVE
  ========================================================= */

  async function saveAccount() {

    if (!requireDinoId())
      return;

    const username =
      $("usernameInput")
        .value
        .trim();

    if (!username) {
      return toast(
        "Enter a username."
      );
    }

    try {

      const data =
        await api(
          "/api/account/username",
          {
            method:"PUT",
            body:JSON.stringify({
              username
            })
          }
        );

      user =
        data.user ||
        data;

      localStorage.setItem(
        USER_KEY,
        JSON.stringify(user)
      );

      updateProfile();

      toast(
        "Username updated."
      );

    } catch (e) {

      toast(e.message);
    }
  }

  window.saveAccount =
    saveAccount;


  /* =========================================================
     MESSAGES
  ========================================================= */

  async function loadMessages() {

    if (isGuest) {

      renderGuestMessages();

      return;
    }

    try {

      const data =
        await api(
          "/api/messages"
        );

      messages =
        (
          data.messages ||
          data ||
          []
        ).map(
          normalizeMessage
        );

      renderMessages();

    } catch (e) {

      toast(e.message);
    }
  }


  function normalizeMessage(m) {

    return {
      ...m,

      id:m.id,

      dinoId:
        m.dinoId ||
        m.dino_id,

      username:
        m.username ||
        "Dino",

      text:
        m.text ||
        m.content ||
        "",

      time:
        m.time ||
        new Date(
          m.created_at ||
          Date.now()
        ).toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
    };
  }


  function renderGuestMessages() {

    const c =
      $("messages");

    if (!c) return;

    if (!messages.length) {

      c.innerHTML = `
        <div class="empty-chat">
          <div class="empty-chat-icon">
            🦖
          </div>

          <h3>
            Welcome to Dinosaur
          </h3>

          <p>
            You are browsing as Guest User.
          </p>

          <p>
            Create a Dino ID to send
            messages to the global chat.
          </p>
        </div>
      `;

      return;
    }

    renderMessages();
  }


  function renderMessages() {

    const c =
      $("messages");

    if (!c) return;

    if (!messages.length) {

      c.innerHTML = `
        <div class="empty-chat">
          <div class="empty-chat-icon">
            🦖
          </div>

          <h3>
            Welcome to Dinosaur
          </h3>

          <p>
            Start the global conversation.
          </p>
        </div>
      `;

      return;
    }

    c.innerHTML =
      messages
        .map(m => {

          const mine =
            m.dinoId ===
            (
              user?.dino_id ||
              user?.dinoId
            );

          return `
            <div class="message ${mine ? "mine" : ""}">

              <div class="avatar">
                🦖
              </div>

              <div class="bubble">

                <div>
                  <span class="message-name">
                    ${esc(m.username)}
                  </span>

                  <span class="message-time">
                    ${esc(m.time)}
                  </span>
                </div>

                <p class="message-text">
                  ${esc(m.text)}
                </p>

                ${
                  mine && !isGuest
                    ? `
                      <div class="message-controls">

                        <button
                          onclick="editServerMessage('${esc(m.id)}')"
                        >
                          Edit
                        </button>

                        <button
                          onclick="deleteServerMessage('${esc(m.id)}')"
                        >
                          Delete
                        </button>

                      </div>
                    `
                    : ""
                }

              </div>

            </div>
          `;

        })
        .join("");

    c.scrollTop =
      c.scrollHeight;
  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage() {

    if (isGuest) {

      toast(
        "🔒 You need a Dino ID to send messages."
      );

      return;
    }

    const input =
      $("messageInput");

    const text =
      input.value.trim();

    if (!text || !token)
      return;

    if (socket?.connected) {

      socket.emit(
        "send-message",
        {
          text
        }
      );

      input.value = "";

      return;
    }

    try {

      const data =
        await api(
          "/api/messages",
          {
            method:"POST",
            body:JSON.stringify({
              content:text,
              text
            })
          }
        );

      messages.push(
        normalizeMessage(
          data.message ||
          data
        )
      );

      input.value = "";

      renderMessages();

    } catch (e) {

      toast(e.message);
    }
  }


  window.editServerMessage =
    async id => {

      if (!requireDinoId())
        return;

      const m =
        messages.find(
          x => x.id === id
        );

      if (!m) return;

      const text =
        prompt(
          "Edit message:",
          m.text
        );

      if (!text?.trim())
        return;

      try {

        const data =
          await api(
            `/api/messages/${encodeURIComponent(id)}`,
            {
              method:"PUT",
              body:JSON.stringify({
                content:text.trim(),
                text:text.trim()
              })
            }
          );

        const nm =
          normalizeMessage(
            data.message ||
            data
          );

        messages =
          messages.map(
            x =>
              x.id === id
                ? nm
                : x
          );

        renderMessages();

      } catch (e) {

        toast(e.message);
      }
    };


  window.deleteServerMessage =
    async id => {

      if (!requireDinoId())
        return;

      if (!confirm(
        "Delete this message?"
      )) {
        return;
      }

      try {

        await api(
          `/api/messages/${encodeURIComponent(id)}`,
          {
            method:"DELETE"
          }
        );

        messages =
          messages.filter(
            x => x.id !== id
          );

        renderMessages();

      } catch (e) {

        toast(e.message);
      }
    };


  $("sendButton").onclick =
    sendMessage;


  $("messageInput")
    .addEventListener(
      "keydown",
      e => {

        if (
          e.key === "Enter" &&
          !e.shiftKey &&
          $("enterToSend")?.checked
        ) {

          e.preventDefault();

          sendMessage();
        }
      }
    );


  /* =========================================================
     SOCKET
  ========================================================= */

  function connectSocket() {

    if (isGuest)
      return;

    if (socket) {
      socket.disconnect();
    }

    socket =
      io(
        API,
        {
          transports:[
            "websocket",
            "polling"
          ],

          auth:{
            token
          }
        }
      );

    socket.on(
      "connect",
      () => {

        socket.emit(
          "join-dinosaur",
          {
            token
          }
        );

        setServer(
          true,
          "DinoChat server online"
        );
      }
    );

    socket.on(
      "new-message",
      m => {

        const nm =
          normalizeMessage(m);

        if (
          !messages.some(
            x => x.id === nm.id
          )
        ) {

          messages.push(nm);

          messages =
            messages.slice(-200);

          renderMessages();
        }
      }
    );

    socket.on(
      "message-deleted",
      id => {

        messages =
          messages.filter(
            x => x.id !== id
          );

        renderMessages();
      }
    );

    socket.on(
      "connect_error",
      () =>
        setServer(
          false,
          "Server connection error"
        )
    );

    socket.on(
      "disconnect",
      () =>
        setServer(
          false,
          "Server disconnected"
        )
    );
  }


  /* =========================================================
     SCORES
  ========================================================= */

  async function loadRankings() {

    if (isGuest) {

      renderScores();

      return;
    }

    try {

      const data =
        await api(
          "/api/scores"
        );

      currentRankings =
        data.rankings ||
        data.users ||
        data ||
        [];

      renderScores();

    } catch (e) {

      toast(e.message);
    }
  }


  function renderScores() {

    const score =
      Number(
        user?.dino_score ??
        user?.dinoScore ??
        0
      );

    if (isGuest) {

      if ($("scoreNumber"))
        $("scoreNumber").textContent =
          "—";

      if ($("scoreRowNumber"))
        $("scoreRowNumber").textContent =
          "—";

      if ($("coinNumber"))
        $("coinNumber").textContent =
          "—";

      if ($("betBalance"))
        $("betBalance").textContent =
          "—";

      if ($("scoreName"))
        $("scoreName").textContent =
          "Guest User";

    } else {

      if ($("scoreNumber"))
        $("scoreNumber").textContent =
          score.toFixed(2);

      if ($("scoreRowNumber"))
        $("scoreRowNumber").textContent =
          score.toFixed(2);

      if ($("coinNumber"))
        $("coinNumber").textContent =
          score.toFixed(2);

      if ($("betBalance"))
        $("betBalance").textContent =
          score.toFixed(2);
    }

    const rankCard =
      $("liveRanking");

    if (!rankCard)
      return;

    if (isGuest) {

      rankCard.innerHTML = `
        <tr>
          <td colspan="3">
            🔒 Sign in with a Dino ID to access live Dino rankings.
          </td>
        </tr>
      `;

      return;
    }

    rankCard.innerHTML =
      (
        currentRankings || []
      )
      .slice(0,100)
      .map(
        (r,i) => {

          const d =
            r.dino_id ||
            r.dinoId;

          return `
            <tr
              class="${
                d ===
                (
                  user?.dino_id ||
                  user?.dinoId
                )
                ? "rank-me"
                : ""
              }"
            >

              <td>
                ${r.rank || i + 1}
              </td>

              <td>

                <b>
                  ${esc(
                    r.username ||
                    "Dino"
                  )}
                </b>

                <div class="online-mini">
                  ${esc(d || "")}
                </div>

              </td>

              <td>
                ${Number(
                  r.dino_score ??
                  r.score ??
                  0
                ).toFixed(2)}
              </td>

            </tr>
          `;
        }
      )
      .join("")
      ||
      `
        <tr>
          <td colspan="3">
            No rankings yet.
          </td>
        </tr>
      `;
  }


  /* =========================================================
     ACHIEVEMENTS
  ========================================================= */

  async function loadAchievements() {

    const container =
      $("achievementGrid");

    if (!container)
      return;

    if (isGuest) {

      container.innerHTML = `
        <div class="feature-card">

          <div style="font-size:34px">
            🔒
          </div>

          <h3>
            Dino ID Required
          </h3>

          <p>
            Achievements are attached to a permanent Dino ID.
          </p>

          <button
            class="btn primary"
            onclick="openDinoLogin()"
          >
            Get Dino ID
          </button>

        </div>
      `;

      return;
    }

    try {

      const data =
        await api(
          "/api/achievements"
        );

      const achievements =
        data.achievements ||
        data ||
        [];

      container.innerHTML =
        achievements
          .map(
            x => `
              <div class="feature-card">

                <div style="font-size:34px">
                  ${esc(x.icon || "🏅")}
                </div>

                <h3>
                  ${esc(
                    x.name ||
                    x.code
                  )}
                </h3>

                <p>
                  ${esc(
                    x.description ||
                    ""
                  )}
                </p>

                <span class="pill">
                  ${
                    x.achieved_at
                      ? "Unlocked"
                      : "Locked"
                  }
                </span>

              </div>
            `
          )
          .join("")
          ||
          `
            <div class="card">
              No achievements yet.
            </div>
          `;

    } catch (e) {

      toast(e.message);
    }
  }


  /* =========================================================
     FRIENDS
  ========================================================= */

  async function loadFriends() {

    if (isGuest) {

      if ($("incomingFriends"))
        $("incomingFriends").innerHTML = `
          <p class="online-mini">
            🔒 A Dino ID is required to use Friends.
          </p>
        `;

      if ($("friendList"))
        $("friendList").innerHTML = `
          <p class="online-mini">
            Create a Dino ID to add friends.
          </p>
        `;

      return;
    }

    try {

      const data =
        await api(
          "/api/friends"
        );

      const incoming =
        data.incoming ||
        data.requests ||
        [];

  /* =========================================================
     SOCIAL
  ========================================================= */

  function validSocialUrl(
    type,
    url
  ) {

    try {

      const u =
        new URL(url);

      const h =
        u.hostname
          .toLowerCase()
          .replace(
            /^www\./,
            ""
          );

      if (type === "instagram") {

        return (
          h === "instagram.com" ||
          h.endsWith(
            ".instagram.com"
          )
        );
      }

      return (
        h === "snapchat.com" ||
        h.endsWith(
          ".snapchat.com"
        )
      );

    } catch {

      return false;
    }
  }

            and track social content.

        </div>
      `;

      return;
    }

    try {

      const data =
        await api(
          "/api/social"
        );

      const items =
        data.content ||
        data.social ||
        data ||
        [];

      list.innerHTML =
        items
          .map(
            x => `

                <div>

                  <b>
                    ${
                      x.content_type === "instagram"

  $("submitSocialBtn").onclick =
    async () => {

      const url =

      $("socialError").textContent =

          url

        return;

      try {

        await api(
          "/api/social",
          {
            method:"POST",
            body:JSON.stringify({
              type,
              contentType:type,

            })

          "Social link submitted."

  function applyTheme() {

    const name =
      localStorage.getItem(
        "dino_theme"
      ) || "mint";

    const t =
      themes[name] ||
      themes.mint;

    document.documentElement
      .style
      .setProperty(
        "--bg",
        t.bg
      );

    document.documentElement
      .style
      .setProperty(
        "--primary",
        t.primary
      );

    document.documentElement
      .style
      .setProperty(
        "--primary-dark",
        t.primary
      );

    document.documentElement
      .style
      .setProperty(
        "--soft",
        t.soft
      );

    document.documentElement
      .style
      .setProperty(
        "--pattern",
        t.pattern
      );

    const dark =
      name.startsWith("dark");

    document.documentElement
      .style
      .setProperty(
        "--text",
        dark
          ? "#f5f7fb"
          : "#173526"
      );

    document.documentElement
      .style
      .setProperty(
        "--muted",
        dark
          ? "#aeb9c8"
          : "#688073"
      );

    document.documentElement
      .style
      .setProperty(
        "--card",
        dark
          ? "#111a27"
          : "#ffffff"
      );

    document.documentElement
      .style
      .setProperty(
        "--card2",
        dark
          ? "#0d1622"
          : "#f7fdf9"
      );

    document.documentElement
      .style
      .setProperty(
        "--border",
        dark
          ? "#26384d"
          : "#cde6d6"
      );
  }


  function renderThemes() {

    const c =
      $("themeGrid");

    if (!c) return;

    const selected =
      localStorage.getItem(
        "dino_theme"
      ) || "mint";

    c.innerHTML =
      Object.entries(themes)
        .map(
          ([k,t]) => `
            <button
              class="theme-button ${
                k === selected
                  ? "selected"
                  : ""
              }"
              onclick="setTheme('${k}')"
            >

              <div
                class="theme-preview"
                style="
                  background:${t.bg};
                  background-image:${t.pattern}
                "
              ></div>

              <strong>
                ${esc(t.name)}
              </strong>

              <small>
                ${
                  k.startsWith("dark")
                    ? "Dark UI"
                    : "Light UI"
                }
              </small>

            </button>
          `
        )
        .join("");
  }


  window.setTheme =
    k => {

      if (!themes[k])
        return;

      localStorage.setItem(
        "dino_theme",
        k
      );

      applyTheme();

      renderThemes();
    };


  /* =========================================================
     LAYOUT
  ========================================================= */

  async function loadLayout() {

    if (isGuest) {

      applyLayout(
        localStorage.getItem(
          "dino_layout"
        ) || "classic"
      );

      return;
    }

    try {

      const data =
        await api(
          "/api/layout"
        );

      const name =
        data.layout_name ||
        data.layoutName ||
        "classic";

      applyLayout(name);

    } catch {

      applyLayout(
        localStorage.getItem(
          "dino_layout"
        ) || "classic"
      );
    }
  }


  function applyLayout(name) {

    document.body.className =
      [
        ...document.body.classList
      ]
      .filter(
        x =>
          !x.startsWith(
            "layout-"
          )
      )
      .join(" ");

    document.body.classList.add(
      "layout-" + name
    );

    localStorage.setItem(
      "dino_layout",
      name
    );

    renderLayoutButtons();
  }


  function renderLayoutButtons() {

    const c =
      $("layoutGrid");

    if (!c) return;

    const active =
      localStorage.getItem(
        "dino_layout"
      ) || "classic";

    c.innerHTML =
      layouts
        .map(
          ([k,n]) => `
            <button
              class="layout-btn ${
                k === active
                  ? "selected"
                  : ""
              }"
              onclick="chooseLayout('${k}')"
            >

              <b>
                ${esc(n)}
              </b>

              <br>

              <small>
                Position preset
              </small>

            </button>
          `
        )
        .join("");
  }


  window.chooseLayout =
    async name => {

      applyLayout(name);

      if (isGuest) {

        toast(
          "Layout saved for Guest Mode."
        );

        return;
      }

      try {

        await api(
          "/api/layout",
          {
            method:"PUT",
            body:JSON.stringify({
              layoutName:name,
              layout_name:name,
              layoutData:{}
            })
          }
        );

        toast(
          "Layout saved."
        );

      } catch (e) {

        toast(e.message);
      }
    };


  /* =========================================================
     PAGE NAVIGATION
  ========================================================= */

  function openPage(page) {

    const scoreFeatures = [
      "scores",
      "achievements",
      "bet"
    ];

    if (
      isGuest &&
      scoreFeatures.includes(page)
    ) {

      requireDinoId();

      return;
    }

    document
      .querySelectorAll(".page")
      .forEach(
        x =>
          x.classList.remove(
            "active"
          )
      );

    const target =
      $("page-" + page);

    if (!target)
      return;

    target.classList.add(
      "active"
    );

    document
      .querySelectorAll(".nav")
      .forEach(
        x =>
          x.classList.toggle(
            "active",
            x.dataset.page === page
          )
      );

    const names = {

      home:"Home",
      chat:"Dinosaur",
      manga:"Manga",
      reels:"Reels & Snaps",
      history:"History",
      scores:"Dino Scores",
      account:"Account",
      settings:"Settings",
      friends:"Friends",
      achievements:"Achievements",
      bet:"Bet",
      social:"Insta + Snap"
    };

    $("pageTitle").textContent =
      names[page] ||
      "DinoChat";

    $("pageSubtitle").textContent =
      page === "chat"
        ? "Global community chat"
        : "DinoChat";

    $("sidebar")
      .classList
      .remove("open");

    if (page === "chat")
      loadMessages();

    if (page === "scores")
      loadRankings();

    if (page === "achievements")
      loadAchievements();

    if (page === "friends")
      loadFriends();

    if (page === "social")
      loadSocial();

    if (page === "bet")
      loadBets();

    if (page === "settings") {

      renderThemes();
      renderLayoutButtons();
    }

    if (page === "account")
      renderAccount();
  }


  window.openPage =
    openPage;


  document
    .querySelectorAll(".nav")
    .forEach(
      b =>
        b.onclick =
          () =>
            openPage(
              b.dataset.page
            )
    );


  $("mobileMenu").onclick =
    () =>
      $("sidebar")
        .classList
        .toggle("open");


  /* =========================================================
     LOGOUT
  ========================================================= */

  window.logoutDino =
    async () => {

      if (isGuest) {

        exitGuestMode();

        return;
      }

      try {

        await api(
          "/api/auth/logout",
          {
            method:"POST"
          }
        );

      } catch {}

      token = "";

      user = null;

      localStorage.removeItem(
        TOKEN_KEY
      );

      localStorage.removeItem(
        USER_KEY
      );

      if (socket) {

        socket.disconnect();

        socket = null;
      }

      showAuth(true);

      switchAuth("login");

      toast(
        "Logged out."
      );
    };

     ADD LIVE RANKING TABLE
  ========================================================= */

    $("page-scores");

  if (
    scorePage &&
    !$("liveRanking")
  ) {

    const box =
      document.createElement(
        "div"
      );

    box.className =
      "card";

    box.style.marginTop =
      "16px";

    box.innerHTML = `

      <h3>
        🌎 Live Global Dino Ranking
      </h3>

      <div style="overflow:auto">

        <table class="table">

          <thead>

            <tr>

              <th>#</th>

              <th>Dino</th>

              <th>Score</th>

            </tr>

          </thead>

          <tbody
            id="liveRanking"
          ></tbody>

        </table>

      </div>
    `;

    scorePage.appendChild(box);
  }


  /* =========================================================
     STARTUP
  ========================================================= */

  (async () => {

    applyTheme();

    renderThemes();

    renderLayoutButtons();

    $("authStatus").textContent =
      "Checking DinoChat server…";


    /* =========================
       GUEST STARTUP
    ========================= */

    if (isGuest) {

      user = {

        username:"Guest User",

        dino_id:null,

        dinoId:null,

        dino_score:0,

        dinoScore:0,

        is_guest:true
      };

      showAuth(false);

      updateProfile();

      renderGuestProfile();

      renderScores();

      renderAccount();

      loadMessages();

      loadFriends();

      loadSocial();

      loadBets();

      setServer(
        true,
        "Guest Mode"
      );

      openPage("home");

      setTimeout(() => {

        const intro =
          $("intro");

        if (intro) {

          intro.style.opacity =
            "0";

          setTimeout(
            () =>
              intro.remove(),
            500
          );
        }

      },300);

      return;
    }


    /* =========================
       NORMAL ACCOUNT STARTUP
    ========================= */

    try {

      if (token) {

        await bootstrap();

        showAuth(false);

      } else {

        await health();

        showAuth(true);
      }

    } catch (e) {

      token = "";

      localStorage.removeItem(
        TOKEN_KEY
      );

      showAuth(true);

      authError(
        "Please sign in or create a Dino account."
      );

      $("authStatus").textContent =
        "Server is ready.";
    }


    setTimeout(() => {

      const intro =
        $("intro");

      if (intro) {

        intro.style.opacity =
          "0";

        setTimeout(
          () =>
            intro.remove(),
          500
        );
      }

    },300);

  })();

})();
</script>
