name: Build DinoEngine Windows EXE
on:
  push:
    branches:
      - dinoengine-v10
      - dinoengine-v9
      - dinoengine-v8
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dinoengine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dinoengine/package.json
      - name: Install
        run: npm install
      - name: Build EXE
        run: npm run package:win
      - name: Apply DinoEngine dinosaur icon
        shell: powershell
        run: |
          if (Test-Path "assets/dinoengine-icon.ico") { npx rcedit "release/DinoEngine.exe" --set-icon "assets/dinoengine-icon.ico" } else { Write-Host "ICO asset not present; keeping EXE build icon." }
      - name: Verify
        shell: powershell
        run: |
          if (-not (Test-Path "release/DinoEngine.exe")) { throw "EXE missing" }
          Get-Item "release/DinoEngine.exe" | Format-List Name,Length
      - name: Smoke test
        shell: powershell
        run: |
          $env:DINOENGINE_ROOT=(Get-Location).Path
          $p=Start-Process -FilePath "release/DinoEngine.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try {
            $h=Invoke-RestMethod "http://127.0.0.1:4387/api/health"
            if(-not $h.ok){throw "Health failed"}
            $m=Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:4387/mcp" -ContentType "application/json" -Body '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
            if(-not $m.result.tools){throw "MCP tools missing"}
            foreach($n in @("ui_paint","animation_create","build_artifact","professional_scaffold","website_audit","engine_patch","godot_create_2d","draw_create","draw_tools","godot_project","godot_tool","gpt_plugin_manifest","remote_start","remote_stop","remote_status")){if(-not ($m.result.tools.name -contains $n)){throw "$n missing"}}
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: DinoEngine-v10-Windows-x64
          path: dinoengine/release/DinoEngine.exe
          if-no-files-found: error
          retention-days: 30

